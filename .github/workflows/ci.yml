name: CI

# Runs the non-mutating quality gates on every pull request and on pushes to
# main. This job must pass before merge; see docs/ci-cd.md for how this fits
# into the full pipeline (deployment is a separate, environment-gated job).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  DOTNET_VERSION: '10.0.x'
  # Non-secret Entra identifiers, needed only so `cdk synth`/infra tests can
  # construct a JWT authorizer. See docs/entra-configuration.md.
  ENTRA_TENANT_ID: '11111111-1111-1111-1111-111111111111'
  ENTRA_CLIENT_ID: '22222222-2222-2222-2222-222222222222'

jobs:
  quality:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Format check (Prettier + dotnet format)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Test (Vitest + xUnit)
        run: npm test

      - name: Build (frontend, shared, .NET Lambda)
        run: npm run build

      - name: CDK synth
        run: npm run synth --workspace infra

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

  e2e-smoke:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Build frontend
        run: npm run build --workspace apps/web
        env:
          VITE_ENTRA_TENANT_ID: ${{ env.ENTRA_TENANT_ID }}
          VITE_ENTRA_CLIENT_ID: ${{ env.ENTRA_CLIENT_ID }}
          VITE_ENTRA_API_SCOPE: api://${{ env.ENTRA_CLIENT_ID }}/access_as_user
          VITE_API_BASE_URL: https://api.dev.example.com

      - name: Run smoke tests
        run: npx playwright test --project=smoke
        working-directory: apps/web

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
